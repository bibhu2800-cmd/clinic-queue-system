<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OPD Queue Display Board</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; padding-top: 50px; }
        .card { background: #222; border-radius: 12px; padding: 40px; display: inline-block; width: 350px; border: 2px solid #00ffcc; }
        .token { font-size: 60px; font-weight: bold; color: #00ffcc; margin: 10px 0; }
        .counter { font-size: 28px; color: #ffaa00; }
        .status { margin-top: 15px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <h1>NOW CALLING</h1>
    
    <div class="card">
        <div>TOKEN NUMBER</div>
        <div id="token" class="token">--</div>
        <div class="counter">Go to Counter: <span id="counter">--</span></div>
        <div id="status" class="status">Connecting to server...</div>
    </div>

    <script>
        const ws = new WebSocket("https://chair-mountable-ounce.ngrok-free.dev /ws/queue");

        ws.onopen = () => {
            document.getElementById("status").innerText = "Live Updates Connected";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.event === "TOKEN_CALLED") {
                document.getElementById("token").innerText = data.token_id;
                document.getElementById("counter").innerText = data.counter_id;
                 // Voice announcement
        const announcement = new SpeechSynthesisUtterance(
            `⁠ Token number ${data.token_id}, please proceed to counter ${data.counter_id} ⁠`
        );
        window.speechSynthesis.speak(announcement);

            }
        };

        ws.onclose = () => {
            document.getElementById("status").innerText = "Disconnected";
        };
    </script>
</body>
</html>
